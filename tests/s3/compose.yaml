services:
  s3:
    image: andrewgaul/s3proxy:4.1.1
    environment:
      S3PROXY_AUTHORIZATION: aws-v4
      S3PROXY_IDENTITY: ${TINYSANDBOX_S3_TEST_ACCESS_KEY:?set by scripts/test-s3-compat.sh}
      S3PROXY_CREDENTIAL: ${TINYSANDBOX_S3_TEST_SECRET_KEY:?set by scripts/test-s3-compat.sh}
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    ports:
      - "127.0.0.1:${TINYSANDBOX_S3_TEST_PORT:?set by scripts/test-s3-compat.sh}:80"
    volumes:
      - s3-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/80 && printf "GET / HTTP/1.0\r\n\r\n" >&3 && head -c 4 <&3 | grep -q HTTP'
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 2s

volumes:
  s3-data:
