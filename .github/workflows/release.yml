# Required repository setup:
# - CARGO_REGISTRY_TOKEN must allow publishing the tinysandbox crate.
# - npm trusted publishing must trust this workflow for @tinysandbox/tinysandbox
#   and its four @tinysandbox/tinysandbox-{platform} native packages.
# - Branch protection must allow github-actions[bot] to push the release commit to main.
# - External contributor Actions runs should require maintainer approval before CI runs.
name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply.
        required: true
        default: patch
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.eligibility.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.release_ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check release eligibility
        id: eligibility
        run: |
          message="$(git log -1 --format=%B)"
          release=true
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if [[ "$message" == *"[skip release]"* || "$message" == chore\(release\):* ]]; then
              release=false
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.eligibility.outputs.release == 'true'

      - uses: actions/setup-node@v4
        if: steps.eligibility.outputs.release == 'true'
        with:
          node-version: 24

      - name: Configure Git author
        if: steps.eligibility.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        if: steps.eligibility.outputs.release == 'true'
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_MESSAGE: ${{ steps.eligibility.outputs.message }}
        run: |
          version="$(node scripts/release-version.mjs next --bump "$RELEASE_BUMP" --message "$RELEASE_MESSAGE")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Apply lockstep version
        if: steps.eligibility.outputs.release == 'true'
        run: |
          node scripts/release-version.mjs apply "${{ steps.version.outputs.version }}"
          cargo update -w
          node scripts/release-version.mjs check "${{ steps.version.outputs.version }}"

      - name: Commit and push release version
        if: steps.eligibility.outputs.release == 'true'
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No release version changes to commit"
            exit 0
          fi
          git add Cargo.toml Cargo.lock tinysandbox-node/Cargo.toml tinysandbox-node/package.json tinysandbox-node/package-lock.json tinysandbox-node/native.cjs tinysandbox-node/npm/*/package.json
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip release]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced before the release commit could be pushed; rebasing release commit (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
          done
          git push origin HEAD:main

      - name: Record release source
        if: steps.eligibility.outputs.release == 'true'
        id: release_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-native:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            artifact: linux-x64-gnu
            uname_arch: x86_64
            binding: tinysandbox-node.linux-x64-gnu.node
          - os: ubuntu-26.04-arm
            artifact: linux-arm64-gnu
            uname_arch: aarch64
            binding: tinysandbox-node.linux-arm64-gnu.node
          - os: macos-26-intel
            artifact: macos-x64
            uname_arch: x86_64
            binding: tinysandbox-node.darwin-x64.node
          - os: macos-26
            artifact: macos-arm64
            uname_arch: arm64
            binding: tinysandbox-node.darwin-arm64.node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ matrix.artifact }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tinysandbox-node/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-${{ matrix.artifact }}-
            ${{ runner.os }}-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tinysandbox-node/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: tinysandbox-node

      - name: Build native binding
        run: npm run build
        working-directory: tinysandbox-node

      - name: Collect native binding
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [ "$actual_arch" != "${{ matrix.uname_arch }}" ]; then
            echo "expected ${{ matrix.uname_arch }} runner, got ${actual_arch}" >&2
            exit 1
          fi
          binding="tinysandbox-node/${{ matrix.binding }}"
          if [ ! -f "$binding" ]; then
            echo "expected native binding ${binding}" >&2
            find tinysandbox-node -maxdepth 1 -name '*.node' -print >&2
            exit 1
          fi
          mkdir native-artifact
          cp "$binding" native-artifact/
          ls -lh native-artifact

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.artifact }}
          path: native-artifact/*.node
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build-native
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tinysandbox-node/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-publish-
            ${{ runner.os }}-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: tinysandbox-node/package-lock.json

      - name: Update npm
        run: npm install -g npm@12.0.2

      - name: Install Node dependencies
        run: npm ci
        working-directory: tinysandbox-node

      - name: Build package wrapper
        run: npm run build
        working-directory: tinysandbox-node

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: true

      - name: Assemble platform-native npm packages
        run: |
          set -euo pipefail
          required_native_bindings=(
            tinysandbox-node.linux-x64-gnu.node
            tinysandbox-node.linux-arm64-gnu.node
            tinysandbox-node.darwin-x64.node
            tinysandbox-node.darwin-arm64.node
          )
          artifact_count="$(find native-artifacts -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')"
          if [ "$artifact_count" -ne "${#required_native_bindings[@]}" ]; then
            echo "expected ${#required_native_bindings[@]} downloaded native artifacts, found ${artifact_count}" >&2
            find native-artifacts -maxdepth 1 -name '*.node' -print >&2
            exit 1
          fi
          for binding in "${required_native_bindings[@]}"; do
            source="native-artifacts/${binding}"
            if [ ! -f "$source" ]; then
              echo "missing required native artifact ${binding}" >&2
              exit 1
            fi
            target="${binding#tinysandbox-node.}"
            target="${target%.node}"
            package_dir="tinysandbox-node/npm/${target}"
            if [ ! -f "${package_dir}/package.json" ]; then
              echo "missing native package manifest ${package_dir}/package.json" >&2
              exit 1
            fi
            cp "$source" "${package_dir}/${binding}"
          done
          native_count="$(find tinysandbox-node/npm -mindepth 2 -maxdepth 2 -name '*.node' | wc -l | tr -d ' ')"
          if [ "$native_count" -ne "${#required_native_bindings[@]}" ]; then
            echo "expected exactly ${#required_native_bindings[@]} platform package artifacts, found ${native_count}" >&2
            exit 1
          fi
          node scripts/verify-native-packages.mjs --require-binaries

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          if curl -fsSL -H "User-Agent: tinysandbox-release-ci" "https://crates.io/api/v1/crates/tinysandbox/${VERSION}" >/dev/null 2>&1; then
            echo "tinysandbox ${VERSION} is already published"
            exit 0
          fi

          cargo publish --locked -p tinysandbox --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish native and facade npm packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: tinysandbox-node
        run: |
          set -euo pipefail
          npm --version
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC request environment is missing" >&2
            exit 1
          fi

          native_targets=(darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu)
          for target in "${native_targets[@]}"; do
            package_dir="npm/${target}"
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${package_name} ${VERSION} is already published"
            else
              npm publish "${package_dir}" --access public
            fi
          done

          if npm view "@tinysandbox/tinysandbox@${VERSION}" version >/dev/null 2>&1; then
            echo "@tinysandbox/tinysandbox ${VERSION} is already published"
          else
            npm publish --access public
          fi
