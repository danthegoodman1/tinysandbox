# Required repository setup:
# - CARGO_REGISTRY_TOKEN must allow publishing the tinysandbox crate.
# - npm trusted publishing must trust this workflow for @tinysandbox/tinysandbox
#   and its four @tinysandbox/tinysandbox-{platform} native packages.
# - Branch protection must allow github-actions[bot] to push the release commit to main.
# - External contributor Actions runs should require maintainer approval before CI runs.
name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply.
        required: true
        default: patch
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.eligibility.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.release_ref.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check release eligibility
        id: eligibility
        run: |
          set -euo pipefail
          head_message="$(git log -1 --format=%B)"
          release=true
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if [[ "$head_message" == *"[skip release]"* || "$head_message" == chore\(release\):* ]]; then
              release=false
            fi
          fi
          # Eligibility reads only the head commit, but version selection reads
          # every commit since the last release so a Conventional Commits
          # breaking marker is not hidden behind a merge commit subject.
          previous_release="$(git log -1 --format=%H --grep '^chore(release): ' HEAD || true)"
          if [ -n "$previous_release" ] && [ "$previous_release" != "$(git rev-parse HEAD)" ]; then
            message="$(git log --format=%B "${previous_release}..HEAD")"
          else
            message="$head_message"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "message<<RELEASE_MESSAGE_EOF"
            echo "$message"
            echo "RELEASE_MESSAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.eligibility.outputs.release == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.eligibility.outputs.release == 'true'
        with:
          node-version: 24

      - name: Configure Git author
        if: steps.eligibility.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        if: steps.eligibility.outputs.release == 'true'
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_MESSAGE: ${{ steps.eligibility.outputs.message }}
        run: |
          version="$(node scripts/release-version.mjs next --bump "$RELEASE_BUMP" --message "$RELEASE_MESSAGE")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Apply lockstep version
        if: steps.eligibility.outputs.release == 'true'
        run: |
          node scripts/release-version.mjs apply "${{ steps.version.outputs.version }}"
          cargo update -w
          node scripts/release-version.mjs check "${{ steps.version.outputs.version }}"

      - name: Commit and push release version
        if: steps.eligibility.outputs.release == 'true'
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No release version changes to commit"
            exit 0
          fi
          git add Cargo.toml Cargo.lock tinysandbox-node/Cargo.toml tinysandbox-node/package.json tinysandbox-node/package-lock.json tinysandbox-node/native.cjs tinysandbox-node/npm/*/package.json
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip release]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced before the release commit could be pushed; rebasing release commit (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
          done
          git push origin HEAD:main

      - name: Record release source
        if: steps.eligibility.outputs.release == 'true'
        id: release_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-linux-native:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            artifact: linux-x64-gnu
            uname_arch: x86_64
            binding: tinysandbox-node.linux-x64-gnu.node
            container_image: quay.io/pypa/manylinux_2_34_x86_64@sha256:249cdcdcd91ba0639b50140a5a4cd09eead2056e2f76267e7919678a66f9d33d
          - os: ubuntu-26.04-arm
            artifact: linux-arm64-gnu
            uname_arch: aarch64
            binding: tinysandbox-node.linux-arm64-gnu.node
            container_image: quay.io/pypa/manylinux_2_34_aarch64@sha256:8621bc7caecfd1e7818a800e8ae8c979936665f180a93e13efeed54cbb026d74
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-${{ matrix.artifact }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tinysandbox-node/package-lock.json

      - name: Install pinned npm CLI
        run: npm install -g npm@12.0.2

      - name: Install Node dependencies
        run: npm ci
        working-directory: tinysandbox-node

      - name: Verify GLIBC build environment
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.34"

      - name: Build native binding
        run: npm run build
        working-directory: tinysandbox-node

      - name: Verify native GLIBC baseline
        run: node scripts/verify-glibc-baseline.mjs "tinysandbox-node/${{ matrix.binding }}" 2.34

      - name: Load native binding on GLIBC 2.34
        run: |
          node -e "const binding = require('./tinysandbox-node/${{ matrix.binding }}'); if (typeof binding.NativeSandbox !== 'function') throw new Error('NativeSandbox export missing')"

      - name: Collect native binding
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [ "$actual_arch" != "${{ matrix.uname_arch }}" ]; then
            echo "expected ${{ matrix.uname_arch }} runner, got ${actual_arch}" >&2
            exit 1
          fi
          binding="tinysandbox-node/${{ matrix.binding }}"
          if [ ! -f "$binding" ]; then
            echo "expected native binding ${binding}" >&2
            find tinysandbox-node -maxdepth 1 -name '*.node' -print >&2
            exit 1
          fi
          mkdir native-artifact
          cp "$binding" native-artifact/
          ls -lh native-artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.artifact }}
          path: native-artifact/*.node
          if-no-files-found: error

  build-macos-native:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            artifact: macos-x64
            uname_arch: x86_64
            binding: tinysandbox-node.darwin-x64.node
          - os: macos-26
            artifact: macos-arm64
            uname_arch: arm64
            binding: tinysandbox-node.darwin-arm64.node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-${{ matrix.artifact }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tinysandbox-node/package-lock.json

      - name: Install pinned npm CLI
        run: npm install -g npm@12.0.2

      - name: Install Node dependencies
        run: npm ci
        working-directory: tinysandbox-node

      - name: Build native binding
        run: npm run build
        working-directory: tinysandbox-node

      - name: Load native binding
        run: |
          node -e "const binding = require('./tinysandbox-node/${{ matrix.binding }}'); if (typeof binding.NativeSandbox !== 'function') throw new Error('NativeSandbox export missing')"

      - name: Collect native binding
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [ "$actual_arch" != "${{ matrix.uname_arch }}" ]; then
            echo "expected ${{ matrix.uname_arch }} runner, got ${actual_arch}" >&2
            exit 1
          fi
          binding="tinysandbox-node/${{ matrix.binding }}"
          if [ ! -f "$binding" ]; then
            echo "expected native binding ${binding}" >&2
            find tinysandbox-node -maxdepth 1 -name '*.node' -print >&2
            exit 1
          fi
          mkdir native-artifact
          cp "$binding" native-artifact/
          ls -lh native-artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.artifact }}
          path: native-artifact/*.node
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build-linux-native
      - build-macos-native
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: publish

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: tinysandbox-node/package-lock.json

      - name: Update npm
        run: npm install -g npm@12.0.2

      - name: Install Node dependencies
        run: npm ci
        working-directory: tinysandbox-node

      - name: Build package wrapper
        run: npm run build
        working-directory: tinysandbox-node

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: true

      - name: Assemble platform-native npm packages
        run: |
          set -euo pipefail
          required_native_bindings=(
            tinysandbox-node.linux-x64-gnu.node
            tinysandbox-node.linux-arm64-gnu.node
            tinysandbox-node.darwin-x64.node
            tinysandbox-node.darwin-arm64.node
          )
          artifact_count="$(find native-artifacts -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')"
          if [ "$artifact_count" -ne "${#required_native_bindings[@]}" ]; then
            echo "expected ${#required_native_bindings[@]} downloaded native artifacts, found ${artifact_count}" >&2
            find native-artifacts -maxdepth 1 -name '*.node' -print >&2
            exit 1
          fi
          for binding in "${required_native_bindings[@]}"; do
            source="native-artifacts/${binding}"
            if [ ! -f "$source" ]; then
              echo "missing required native artifact ${binding}" >&2
              exit 1
            fi
            target="${binding#tinysandbox-node.}"
            target="${target%.node}"
            package_dir="tinysandbox-node/npm/${target}"
            if [ ! -f "${package_dir}/package.json" ]; then
              echo "missing native package manifest ${package_dir}/package.json" >&2
              exit 1
            fi
            cp "$source" "${package_dir}/${binding}"
          done
          native_count="$(find tinysandbox-node/npm -mindepth 2 -maxdepth 2 -name '*.node' | wc -l | tr -d ' ')"
          if [ "$native_count" -ne "${#required_native_bindings[@]}" ]; then
            echo "expected exactly ${#required_native_bindings[@]} platform package artifacts, found ${native_count}" >&2
            exit 1
          fi
          node scripts/verify-native-packages.mjs --require-binaries

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          if curl -fsSL -H "User-Agent: tinysandbox-release-ci" "https://crates.io/api/v1/crates/tinysandbox/${VERSION}" >/dev/null 2>&1; then
            echo "tinysandbox ${VERSION} is already published"
            exit 0
          fi

          cargo publish --locked -p tinysandbox --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish native and facade npm packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: tinysandbox-node
        run: |
          set -euo pipefail
          npm --version
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC request environment is missing" >&2
            exit 1
          fi

          native_targets=(darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu)
          for target in "${native_targets[@]}"; do
            package_dir="npm/${target}"
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${package_name} ${VERSION} is already published"
            else
              npm publish "./${package_dir}" --access public
            fi
          done

          if npm view "@tinysandbox/tinysandbox@${VERSION}" version >/dev/null 2>&1; then
            echo "@tinysandbox/tinysandbox ${VERSION} is already published"
          else
            npm publish --access public
          fi

      - name: Refresh lockfile with published native packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # `release-version.mjs apply` can only leave placeholder entries for
          # the native packages, because the version does not exist on npm when
          # the release commit is built. They resolve now that publishing is
          # done, and `npm ci` rejects the placeholders until they do. The
          # refresh retries while the registry catches up with the packages this
          # run just published, and fails the release rather than committing a
          # lockfile that would break `npm ci` on main.
          node scripts/refresh-native-lockfile.mjs "${VERSION}"
          if git diff --quiet -- tinysandbox-node/package-lock.json; then
            echo "lockfile already resolves ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tinysandbox-node/package-lock.json
          git commit -m "chore(release): resolve ${VERSION} lockfile entries [skip release]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced before the lockfile refresh could be pushed; rebasing (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
          done
          git push origin HEAD:main
