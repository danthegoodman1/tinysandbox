name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-release-gates:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install release npm CLI
        run: npm install -g npm@12.0.2
      - name: Check release scripts and native matrix
        run: |
          node --test scripts/release-version.test.mjs scripts/release-native-artifacts.test.mjs scripts/refresh-native-lockfile.test.mjs scripts/verify-glibc-baseline.test.mjs
          node scripts/release-version.mjs check "$(node scripts/release-version.mjs next --bump current)"
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-features --locked
      # Select the core package alone: the Node workspace member enables JS
      # and S3 on its dependency even with workspace --no-default-features.
      - name: Test core without optional features, including doctests
        run: cargo test -p tinysandbox --no-default-features --locked
      - name: Test core with default features, including doctests
        run: cargo test -p tinysandbox --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - run: cargo publish --dry-run --locked -p tinysandbox

  rust-s3-compat:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: s3
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tinysandbox-node/package-lock.json
      - name: Install pinned npm CLI
        run: npm install -g npm@11.12.1
      - run: npm ci
        working-directory: tinysandbox-node
      - name: Test Rust and Node against loopback S3-compatible API
        run: scripts/test-s3-compat.sh

  portable-js-runtime:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tinysandbox-js-runtime/package-lock.json
      - name: Install pinned npm CLI
        run: npm install -g npm@11.12.1
      - run: npm ci
        working-directory: tinysandbox-js-runtime
      - run: npm test
        working-directory: tinysandbox-js-runtime
      - run: npm run test:convex
        working-directory: tinysandbox-js-runtime
      - name: Verify Chrome is installed
        run: test -x /usr/bin/google-chrome
      - name: Test in headless Chrome
        run: CHROME_PATH=/usr/bin/google-chrome npm run test:browser
        working-directory: tinysandbox-js-runtime
      - run: npm pack --dry-run
        working-directory: tinysandbox-js-runtime

  node-linux:
    name: node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            container_image: quay.io/pypa/manylinux_2_34_x86_64@sha256:249cdcdcd91ba0639b50140a5a4cd09eead2056e2f76267e7919678a66f9d33d
            binding: tinysandbox-node.linux-x64-gnu.node
          - os: ubuntu-26.04-arm
            container_image: quay.io/pypa/manylinux_2_34_aarch64@sha256:8621bc7caecfd1e7818a800e8ae8c979936665f180a93e13efeed54cbb026d74
            binding: tinysandbox-node.linux-arm64-gnu.node
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container_image }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tinysandbox-node/package-lock.json
      - name: Install pinned npm CLI
        run: npm install -g npm@11.12.1
      - run: npm ci
        working-directory: tinysandbox-node
      - name: Verify GLIBC build environment
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.34"
      - run: npm test
        working-directory: tinysandbox-node
      - name: Verify native GLIBC baseline
        run: node scripts/verify-glibc-baseline.mjs "tinysandbox-node/${{ matrix.binding }}" 2.34
      - run: npm run examples
        working-directory: tinysandbox-node
      - run: npm pack --dry-run
        working-directory: tinysandbox-node

  node-macos:
    name: node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tinysandbox-node/package-lock.json
      - name: Install pinned npm CLI
        run: npm install -g npm@11.12.1
      - run: npm ci
        working-directory: tinysandbox-node
      - name: Test local filesystem containment and conformance on macOS
        run: cargo test -p tinysandbox --no-default-features --locked --test vfs_local --test vfs_conformance
      - run: npm test
        working-directory: tinysandbox-node
      - run: npm run examples
        working-directory: tinysandbox-node
      - run: npm pack --dry-run
        working-directory: tinysandbox-node
