[package]
name = "tinysandbox-node"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aws-config = "1.10.1"
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls"] }
napi = { version = "3", features = ["tokio_rt", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tinysandbox = { version = "0.5.0", path = "..", features = ["s3"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "time"] }

[build-dependencies]
napi-build = "2"
